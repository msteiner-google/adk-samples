# pre-commit was already a dev dependency with no config. These hooks mirror
# `make check` so the same failures surface locally before CI runs them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
        # The sample PDFs under data/ are the point of this repo.
        exclude: ^data/.*\.pdf$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src|scripts)/
      - id: ruff-format
        files: ^(src|scripts)/

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
