name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything here is free and offline: no model is called, no credentials
  # are needed. This is the gate that runs on every pull request.
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Every `make` target shells out to `uv run`, which re-syncs the
      # environment from uv.lock before running. That would undo the
      # resolution in "Install dependencies" on the very first target.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # Resolves from the public index rather than from uv.lock.
      #
      # uv.lock is generated on a workstation behind a private package
      # registry, so it records absolute URLs pointing at that registry.
      # These runners cannot reach it, and `uv sync` would fail on the first
      # download. `uv pip install` ignores uv.lock entirely and resolves
      # against whatever index the runner is configured for, which is PyPI.
      #
      # The trade-off is deliberate: CI tests the newest versions allowed by
      # pyproject.toml rather than the pinned set. That catches upstream
      # breakage early, and it means a green CI run does not prove the
      # lockfile itself is installable.
      - name: Install dependencies
        run: |
          uv venv
          uv pip install --python .venv -e . --group dev

      - name: Lint
        run: make check

      - name: Test
        run: make test

      # Guards the conversion step itself. It embeds the PDFs under data/ as
      # base64, so a broken template or a missing file is caught here rather
      # than at the start of a paid eval run.
      - name: Build the evalset
        run: make convert

      - name: Check the report generator runs
        run: uv run python scripts/generate_report.py --help

      - name: Check the batch matrix expands
        run: uv run python scripts/run_batch_eval.py --dry-run --budgets 0,2048
